name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python tools/test_models.py
      - run: python tools/build_helpers.py --check
      - run: bash gradlew :projection-lab:assembleDebug :projection-lab:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: GlassProjection-debug
          path: projection-lab/build/outputs/apk/debug/*.apk
